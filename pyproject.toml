[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-state-space-lab"
version = "0.9.0"
description = "Scientific in-silico perturbation and recovery analysis of neural population trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lathushan RK"}]
keywords = ["neuroscience", "dynamical-systems", "state-space", "simulation", "EEG"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics", "Operating System :: OS Independent"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
eeg = ["mne>=1.5"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1", "mne>=1.5"]
docs = ["mkdocs>=1.5"]

[project.scripts]
nssl-demo = "nssl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
