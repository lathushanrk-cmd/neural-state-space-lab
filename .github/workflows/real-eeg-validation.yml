name: optional real EEGBCI reproduction
on:
  push:
    paths:
      - '.github/workflows/real-eeg-validation.yml'
      - 'reproduce/eegbci_demo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce-eegbci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and EEG requirements
        run: python -m pip install -e ".[eeg]"
      - name: Download public recordings and execute analysis
        run: python reproduce/eegbci_demo.py
      - name: Confirm observation results exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/eegbci")
          figure=p/"eeg_observational.png"
          meta=p/"eeg_observational_metadata.json"
          assert figure.exists() and figure.stat().st_size > 1000
          result=json.loads(meta.read_text())
          assert result["test_trials"] > 0 and result["train_trials"] > 0
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eegbci-observational-artifacts
          path: outputs/eegbci/
          if-no-files-found: warn
      - name: Preserve verified observational output in repository
        run: |
          mkdir -p results/eegbci_subject1
          cp outputs/eegbci/eeg_observational.png results/eegbci_subject1/
          cp outputs/eegbci/eeg_observational_metadata.json results/eegbci_subject1/
          cat > results/eegbci_subject1/README.md <<'EOF'
          # PhysioNet EEGBCI: subject 1, motor imagery
          
          This figure is derived from **actual public EEG recordings**, not the synthetic simulation used elsewhere in the repository.
          
          Run `python reproduce/eegbci_demo.py` to reproduce the analysis. It downloads PhysioNet EEG Motor Movement/Imagery EDF files for subject 1, runs 6, 10 and 14, filters EEG at 7–30 Hz, selects hand/foot imagery events, and measures held-out trial distances to training-condition reference trajectories in PCA space.
          
          The metadata records the event mapping and train/test trial counts. No permutation p-value, recovery claim, causal perturbation or across-subject finding is reported. The split is within participant and can have run/session dependence. The displayed distances are descriptive and preprocessing-dependent.
          
          Source: https://physionet.org/content/eegmmidb/
          
          Reproduction workflow: [optional real EEGBCI reproduction](https://github.com/lathushanrk-cmd/neural-state-space-lab/actions/workflows/real-eeg-validation.yml).
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eegbci_subject1
          if ! git diff --cached --quiet; then
            git commit -m "Record reproduced PhysioNet subject 1 observational figure [skip ci]"
            for try in 1 2 3; do
              git pull --rebase origin main
              git push origin HEAD:main && break
              if [ "$try" -eq 3 ]; then exit 1; fi
            done
          fi
