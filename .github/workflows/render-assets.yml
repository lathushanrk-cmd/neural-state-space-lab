name: render verified synthetic research figures
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/render-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and rendering dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mathematics and software checks
        run: python -m pytest -q
      - name: Render seeded mathematical simulations
        env:
          MPLBACKEND: Agg
        run: python -m nssl.cli --output assets
      - name: Commit reproducible figures to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero_simulation.png assets/hero_simulation.svg assets/phase_portraits.png assets/phase_portraits.svg assets/two_condition_simulation.png assets/two_condition_simulation.svg assets/regression_to_mean_trap.png assets/regression_to_mean_trap.svg assets/simulation_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Add generated synthetic scientific visualizations [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
