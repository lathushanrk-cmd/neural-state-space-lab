name: render verified synthetic research figures
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'docs/ORIGINAL_MASTER_GUIDE.md'
      - '.github/workflows/render-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and rendering dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mathematics and software checks
        run: python -m pytest -q
      - name: Render seeded mathematical simulations
        env:
          MPLBACKEND: Agg
        run: python -m nssl.cli --output assets
      - name: Measure workflow-host benchmark
        run: python reproduce/benchmark.py
      - name: Build distributable wheel from repository source
        run: |
          python -m pip install build
          python -m build --wheel --outdir distribution
      - name: Write checksums for generated and existing files
        run: python reproduce/repository_manifest.py
      - name: Commit reproducible figures to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ benchmarks/results.json distribution/ REPOSITORY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated figures, benchmark, wheel and checksum manifest [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
