name: verify reproducible synthetic figures
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'reproduce/**'
      - 'pyproject.toml'
      - '.github/workflows/render-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run software checks
        run: python -m pytest -q
      - name: Generate figures into isolated verification directory
        env:
          MPLBACKEND: Agg
        run: python -m nssl.cli --output outputs/verified-figures
      - name: Verify scientific figure files exist and are nonempty
        run: |
          python -c "from pathlib import Path; p=Path('outputs/verified-figures'); stems=('hero_simulation','phase_portraits','regression_to_mean_trap','two_condition_simulation'); paths=[p/(s+'.'+ext) for s in stems for ext in ('png','svg')]+[p/'simulation_results.json']; assert all(f.is_file() and f.stat().st_size>100 for f in paths), paths; print('Verified',len(paths),'synthetic output files')"
      - name: Build wheel without modifying repository
        run: |
          python -m pip install build
          python -m build --wheel --outdir outputs/distribution
      - name: Verify built wheel exists
        run: python -c "from pathlib import Path; wheels=list(Path('outputs/distribution').glob('*.whl')); assert len(wheels)==1, wheels; print(wheels[0])"
